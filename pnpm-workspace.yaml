blockExoticSubdeps: true

# An install script that isn't approved in allowBuilds fails the install instead of being skipped.
strictDepBuilds: true
# Don't install versions published in the last 24 hours (minutes); most malicious releases are pulled within hours.
minimumReleaseAge: 1440
# Refuse a version published with weaker trust evidence (e.g. lost provenance) than earlier ones: the sign of a hijacked account.
trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Vite+ (`vp`): one toolchain for dev, build, test, lint and format. Its
# `vite` is a repackaged Vite core; the override makes everything that asks
# for vite (vitest included) get that same copy. It is newer than 8.0.16, the
# floor for GHSA-fx2h-pf6j-xcff / GHSA-v6wh-96g9-6wx3 that the old override
# pinned.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.2.0
  vite-plus: 1.3.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
