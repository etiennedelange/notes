[workspace]
members = ["core", "notes-iced"]

[package]
name = "notes"
version = "0.2.0"
description = "A fast, low-ceremony editor for .txt and .md files"
authors = ["Etienne de Lange"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notes-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
# Cheap at this size, and it turns a silently-wrapped bounds check into a loud
# abort rather than an unbounded directory walk. The cost: in release, any
# overflow anywhere — not just the budget arithmetic this was added for —
# now aborts the whole process, taking every unsaved buffer with it.
overflow-checks = true
