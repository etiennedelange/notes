[workspace]
members = ["core"]

[package]
name = "notes"
version = "0.7.6"
description = "A fast, low-ceremony editor for .txt and .md files"
authors = ["Etienne de Lange"]
license = "MIT"
repository = "https://github.com/etiennedelange/notes"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notes-core = { path = "core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
# tauri::generate_context! embeds the `plugins` section of tauri.conf.json as serde_json values.
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# Without the default `zip` feature: it only unpacks v1-style compressed update
# artifacts, and this app ships Tauri v2 ones (the NSIS .exe, .app.tar.gz on
# macOS, a bare .AppImage). It also pulled in `zip` 4.x, which cargo audit
# flags (RUSTSEC-2026-0367/0368/0369).
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
# Cheap at this size, and it turns a silently-wrapped bounds check into a loud
# abort rather than an unbounded directory walk. The cost: in release, any
# overflow anywhere — not just the budget arithmetic this was added for —
# now aborts the whole process, taking every unsaved buffer with it.
overflow-checks = true
