# cargo-audit configuration.
# Every entry below is an *unmaintained* or *unsound* warning in a transitive
# dependency of Tauri. None is a vulnerability, and none can be fixed from this
# crate -- they clear when Tauri bumps the dependency upstream. Re-check on each
# Tauri upgrade and drop entries that no longer fire.

[advisories]
ignore = [
    # unic-* 0.9.0: unmaintained, pulled in by urlpattern 0.3 -> tauri-utils.
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0100", # unic-ucd-ident
    "RUSTSEC-2025-0098", # unic-ucd-version

    # Linux-only build graph; not present in the Windows/macOS target tree.
    "RUSTSEC-2024-0370", # proc-macro-error 1.0.4: unmaintained
    "RUSTSEC-2024-0429", # glib 0.18.5: unsound VariantStrIter iterator impls
]
