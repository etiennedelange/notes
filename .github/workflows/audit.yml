name: Security audit

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/core/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/.cargo/audit.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "site/pnpm-lock.yaml"
      - "site/pnpm-workspace.yaml"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "src-tauri/Cargo.toml"
      - "src-tauri/core/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/.cargo/audit.toml"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "site/pnpm-lock.yaml"
      - "site/pnpm-workspace.yaml"
      - ".github/workflows/audit.yml"
  # Advisories get published against dependencies that haven't changed, so the
  # scheduled run is the one that actually catches things. Mondays, 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions: {}

jobs:
  audit:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Prebuilt binary — `cargo install cargo-audit` compiles for minutes.
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-audit

      # Must run from src-tauri: cargo-audit resolves .cargo/audit.toml relative
      # to the working directory, NOT to --file. Running from the repo root
      # silently ignores the config and the deny list below stops meaning
      # anything.
      #
      # -D warnings makes any *new* unmaintained/unsound advisory fail too. The
      # ten currently pinned by Tauri's dependency graph are listed in
      # .cargo/audit.toml; everything else is a red build on purpose.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit --deny warnings

  pnpm:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # The app and the marketing site have separate lockfiles.
        dir: [".", "site"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false
      # Production dependencies only: dev tools don't ship. High and critical fail the job;
      # ignore one that doesn't apply under auditConfig.ignoreGhsas in that folder's
      # pnpm-workspace.yaml, with a comment saying why.
      - name: pnpm audit (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: pnpm audit --prod --audit-level high
