name: CI

# The Rust side lives in rust.yml, so it only runs when src-tauri changes.
# The site, docs and devcontainer can't affect the app's front end.
on:
  push:
    branches: [main]
    # Later patterns win, so this workflow file is re-included after .github.
    paths: &paths
      - "**"
      - "!site/**"
      - "!src-tauri/**"
      - "!docs/**"
      - "!.devcontainer/**"
      - "!**/*.md"
      - "!.github/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *paths
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first; don't burn runners on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `npm run build` is `tsc && vite build`, and tsconfig sets noEmit, so this
      # typechecks and then catches anything that only fails in a real bundle.
      - name: Typecheck and build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test
