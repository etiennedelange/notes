name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first; don't burn runners on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `npm run build` is `tsc && vite build`, and tsconfig sets noEmit, so this
      # typechecks and then catches anything that only fails in a real bundle.
      - name: Typecheck and build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # libxkbcommon/libwayland are for the exploratory Iced UI
      # (`notes-iced`, iced-rewrite branch), which is a workspace member.
      # Tauri links against the GTK/WebKit stack on Linux, so the crate won't
      # compile without these — even for `cargo test`, which never opens a
      # window. The frontend bundle is NOT needed: generate_context! tolerates a
      # missing frontendDist for a non-bundled build.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libxkbcommon-dev \
            libwayland-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Run both profiles: release disables debug assertions and enables
      # overflow-checks explicitly, so the two can disagree — which is exactly
      # how the walk_dir budget underflow hid (panic in debug, silent wrap in
      # release).
      - name: Tests (debug)
        working-directory: src-tauri
        run: cargo test --workspace

      - name: Tests (release)
        working-directory: src-tauri
        run: cargo test --workspace --release
