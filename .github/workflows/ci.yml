name: CI

# The Rust side lives in rust.yml. The site, docs and devcontainer can't affect
# the app's front end, so pushes to main that only touch those skip this
# workflow. PRs always run it, because `frontend` is a required check (a
# workflow skipped by `paths:` leaves it pending): the job asks
# scripts/release/release.mjs ci-scope instead and skips its steps.
on:
  push:
    branches: [main]
    # Later patterns win, so this workflow file is re-included after .github.
    paths: &paths
      - "**"
      - "!site/**"
      - "!src-tauri/**"
      - "!docs/**"
      - "!.devcontainer/**"
      - "!**/*.md"
      - "!.github/**"
      - ".github/workflows/ci.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A second push supersedes the first; don't burn runners on stale commits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A PR checks out its merge commit; with its parents, HEAD^1 is main and
          # HEAD^1..HEAD is exactly the PR's change.
          fetch-depth: 2

      # The job still runs and passes when there's nothing to test, so the
      # required check reports, but its steps are skipped.
      - name: Anything to test?
        id: scope
        if: github.event_name == 'pull_request'
        run: node scripts/release/release.mjs ci-scope HEAD^1 HEAD >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.scope.outputs.frontend != 'false'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.scope.outputs.frontend != 'false'
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: steps.scope.outputs.frontend != 'false'

      # Format, lint and typecheck (Vite+: oxfmt, oxlint with type-aware rules).
      - name: Check
        if: steps.scope.outputs.frontend != 'false'
        run: pnpm check

      # `pnpm run build` is `tsc && vp build`, and tsconfig sets noEmit, so this
      # typechecks and then catches anything that only fails in a real bundle.
      - name: Typecheck and build
        if: steps.scope.outputs.frontend != 'false'
        run: pnpm run build

      - name: Unit tests
        if: steps.scope.outputs.frontend != 'false'
        run: pnpm test

      # The release and CI-scope scripts (scripts/**/*.test.mjs).
      - name: Script tests
        if: steps.scope.outputs.frontend != 'false'
        run: pnpm test:scripts

      # The real front end in headless Chromium, with scripts/screenshots/mock.js
      # standing in for the Rust backend (e2e/).
      - name: Install Chromium
        if: steps.scope.outputs.frontend != 'false'
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        if: steps.scope.outputs.frontend != 'false'
        run: pnpm test:e2e
