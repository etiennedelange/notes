name: Cut release

# `pnpm release` without your machine: Actions → Cut release → Run workflow, with a version or
# empty for the next patch. It runs scripts/release/ship.mjs: the release PR, auto-merge once CI
# is green, then the tag, which starts release.yml. See docs/RELEASING.md.
#
# Everything is pushed and opened with RELEASE_TOKEN, a fine-grained token of the repo owner
# (Contents, Pull requests and Issues: read and write). The job's own GITHUB_TOKEN wouldn't do:
# a PR or tag it creates starts no workflows, so CI would never report and release.yml never run.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.8.0 or 0.8.0-beta.1. Empty for the next patch.
        required: false

permissions:
  contents: read

# One release at a time; a second run waits instead of racing for the same tag.
concurrency:
  group: cut-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # CI on a version-only PR takes seconds; ship.mjs gives up on the merge after ten minutes.
    timeout-minutes: 30
    steps:
      - name: Check the token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::The RELEASE_TOKEN secret is not set (docs/RELEASING.md, Cutting a release from GitHub)"
            exit 1
          fi

      # The token stays in .git/config on purpose: ship.mjs pushes the release branch and tag with it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          # ship.mjs reads the tags and branches from origin/main.
          fetch-depth: 0
          # git push uses it, so the branch and tag start CI and release.yml.
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      # `release.mjs version` updates Cargo.lock with `cargo update --offline`, which needs the
      # crates.io index cached. This is a no-op on the lockfile that fetches it.
      - name: Fetch the crates.io index
        run: cargo update --package notes --manifest-path src-tauri/Cargo.toml

      # The release commit is yours, as from `pnpm release`; it's squashed into main anyway.
      - name: Configure git
        env:
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
        run: |
          git config user.name "$ACTOR"
          git config user.email "$ACTOR_ID+$ACTOR@users.noreply.github.com"

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          args=(--yes --no-follow)
          if [ -n "$VERSION" ]; then args=("$VERSION" "${args[@]}"); fi
          node scripts/release/ship.mjs "${args[@]}"
